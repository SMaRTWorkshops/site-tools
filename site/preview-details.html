<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Info page preview</title>
  <style>
    body { margin: 0; padding: 32px 16px; background: #fff; color: #222; font-family: Georgia, serif; line-height: 1.5; }
    main { max-width: 760px; margin: 0 auto; }
    .note { color: #64748b; font-size: 14px; margin-bottom: 24px; font-family: sans-serif; }
    .label { font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="note">Preview of an info page's details section. Add ?page=lang-r-info
      (or another page name) to the address. The section below loads the same way
      it does on Squarespace, where the page name comes from the page's own address.</p>

    <p><span class="label">Instructor:</span><br>(The instructor line stays in Squarespace.)</p>

    <div class="sw-details" id="details"></div>
    <script>
      var page = new URLSearchParams(location.search).get("page") || "lang-r-info";
      document.getElementById("details").setAttribute("data-page", page);
    </script>
    <script src="loader.js"></script>
  </main>
</body>
</html>
